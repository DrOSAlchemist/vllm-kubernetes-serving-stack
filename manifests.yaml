apiVersion: v1
kind: Namespace
metadata:
  name: llm-serving
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-serving
spec:
  replicas: 2
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args: ["--model", "$(MODEL_NAME)", "--gpu-memory-utilization", "0.85", "--enable-prefix-caching"]
        env:
        - name: MODEL_NAME
          value: meta-llama/Llama-3.1-8B-Instruct
        ports: [{containerPort: 8000, name: http}]
        resources:
          limits: {nvidia.com/gpu: "1"}
          requests: {cpu: "2", memory: 16Gi, nvidia.com/gpu: "1"}
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm-serving
spec:
  selector: {app: vllm}
  ports: [{port: 8000, targetPort: http, name: http}]
